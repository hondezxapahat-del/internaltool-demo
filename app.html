<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinolytics Internal — Document Finder</title>
<style>
  :root {
    --ink: #141414;
    --paper: #ffffff;
    --red: #a4161a;
    --grey: #8a8a8a;
    --line: #e6e2df;
    --rag-bg: #fdf1f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; }
  .layout { display: flex; height: 100vh; }
  .app { display: flex; flex-direction: column; height: 100vh; flex: 1; min-width: 0; }

  .sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; }
  .sidebar-top { padding: 18px 20px 14px 20px; }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: var(--ink); cursor: pointer; }
  .brand span { color: var(--red); }
  .sidebar-new-chat { margin: 0 16px 12px 16px; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; background: none; text-align: left; }
  .sidebar-new-chat:hover { border-color: var(--red); color: var(--red); }
  .thread-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .thread-item { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .thread-item:hover { background: #f7f5f3; }
  .thread-item.active { background: var(--rag-bg); }
  .thread-item-body { flex: 1; min-width: 0; }
  .thread-item-title { font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-item.active .thread-item-title { color: var(--red); font-weight: 600; }
  .thread-item-doc { font-size: 11px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-item-delete { flex-shrink: 0; font-size: 15px; color: var(--grey); background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px; visibility: hidden; }
  .thread-item:hover .thread-item-delete { visibility: visible; }
  .thread-item-delete:hover { color: var(--red); background: #f0d6d6; }
  .thread-empty { font-size: 12.5px; color: var(--grey); padding: 8px 10px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .doc-badge { font-size: 12px; color: var(--grey); }
  .doc-badge b { color: var(--red); }
  .new-chat { font-size: 12px; color: var(--grey); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; cursor: pointer; background: none; }
  .new-chat:hover { border-color: var(--red); color: var(--red); }

  .thread { flex: 1; overflow-y: auto; padding: 28px 0 20px 0; }
  .thread-inner { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  .identify-card { max-width: 560px; margin: 8vh auto 0 auto; padding: 0 24px; }
  .identify-card h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; margin-bottom: 10px; }
  .identify-card .sub { color: var(--grey); font-size: 14.5px; line-height: 1.55; margin-bottom: 24px; }
  .identify-card textarea {
    width: 100%; min-height: 130px; resize: vertical; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 14px; font: inherit; font-size: 14.5px; line-height: 1.5; color: var(--ink);
  }
  .identify-card textarea:focus { outline: none; border-color: var(--red); }
  .identify-card button.primary {
    margin-top: 14px; background: var(--ink); color: #fff; border: none; border-radius: 10px;
    padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .identify-card button.primary:hover { background: var(--red); }
  .identify-card button.primary:disabled { opacity: 0.5; cursor: default; }
  .identify-result { margin-top: 18px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; display: none; }
  .identify-result.show { display: block; }
  .identify-result.matched { background: #f5f9f5; border: 1px solid #cfe3cf; }
  .identify-result.unmatched { background: #fbf3f3; border: 1px solid #f0d6d6; }
  .identify-result .doc-name { color: var(--red); font-weight: 700; }
  .identify-result .meta { color: var(--grey); font-size: 12px; margin-top: 6px; }
  .identify-result button.enter-chat { margin-top: 12px; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .msg { margin-bottom: 26px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 14px 14px 2px 14px; max-width: 75%; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; }

  .msg-ai .label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .source-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 4px; background: var(--rag-bg); color: var(--red); border: 1px solid #f0d6d6; }
  .msg-ai .answer-block { border-left: 3px solid var(--red); padding-left: 16px; font-size: 14.5px; line-height: 1.7; color: #262626; }
  .msg-ai .answer-block p { margin-bottom: 10px; }
  .msg-ai .answer-block p:last-child { margin-bottom: 0; }
  .msg-ai .answer-block strong { color: var(--ink); font-weight: 700; }
  .msg-ai .answer-block .answer-list { margin: 4px 0 14px 0; padding-left: 20px; }
  .msg-ai .answer-block .answer-list li { margin-bottom: 6px; }
  .msg-ai .answer-block .answer-spacer { height: 4px; }

  .error-block { border-left: 3px solid #c0392b; padding-left: 16px; font-size: 14px; color: #c0392b; }

  .thinking { display: flex; align-items: center; gap: 8px; color: var(--grey); font-size: 13.5px; padding-left: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: pulse 1.1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

  .composer { flex-shrink: 0; border-top: 1px solid var(--line); padding: 16px 24px 20px 24px; background: #fff; display: none; }
  .composer.show { display: block; }
  .composer-inner { max-width: 680px; margin: 0 auto; }
  .ask-box { border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 18px; display: flex; align-items: flex-end; gap: 10px; }
  .ask-box:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(164, 22, 26, 0.08); }
  textarea#q { flex: 1; border: none; outline: none; resize: none; font-family: inherit; font-size: 14.5px; line-height: 1.6; padding: 12px 0; min-height: 22px; max-height: 140px; color: var(--ink); }
  textarea#q::placeholder { color: #b0b0b0; }
  .send-btn { background: var(--red); border: none; width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-bottom: 4px; }
  .send-btn:hover { background: #841216; }
  .send-btn:disabled { background: #e6c9ca; cursor: default; }
  .send-btn svg { width: 15px; height: 15px; stroke: #fff; }
  .hint { font-size: 11.5px; color: #b0b0b0; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="index.html">Sino<span>lytics</span></a>
    </div>
    <button class="sidebar-new-chat" onclick="startNewChat()">+ New chat</button>
    <div class="thread-list" id="threadList"></div>
  </div>

<div class="app">
  <div class="top">
    <div class="doc-badge" id="docBadge"></div>
    <button class="new-chat" onclick="startNewChat()">+ New chat</button>
  </div>

  <div class="thread" id="thread">
    <div class="identify-card" id="identifyCard">
      <h1>Where's this from?</h1>
      <p class="sub">Paste a passage of text from a report and this tool will tell you which internal document it's actually from.</p>
      <textarea id="snippetInput" placeholder="Paste a passage of text here..."></textarea>
      <div><button class="primary" id="identifyBtn">Identify Source</button></div>
      <div id="resultBox" class="identify-result"></div>
    </div>
    <div class="thread-inner" id="threadInner"></div>
  </div>

  <div class="composer" id="composer">
    <div class="composer-inner">
      <div class="ask-box">
        <textarea id="q" rows="1" placeholder="Ask a follow-up about this document…"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <div class="hint">Answers are limited strictly to this document's content.</div>
    </div>
  </div>
</div>
</div>

<script>
const API_BASE = "https://internaltool-demo.onrender.com";

const identifyCard = document.getElementById('identifyCard');
const snippetInput = document.getElementById('snippetInput');
const identifyBtn = document.getElementById('identifyBtn');
const resultBox = document.getElementById('resultBox');
const threadInner = document.getElementById('threadInner');
const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const docBadge = document.getElementById('docBadge');
const q = document.getElementById('q');
const sendBtn = document.getElementById('sendBtn');
const threadList = document.getElementById('threadList');

let sessionId = new URLSearchParams(window.location.search).get('session_id');
let currentDocument = null;

function startNewChat() {
  const url = new URL(window.location.href);
  url.searchParams.delete('session_id');
  window.location.href = url.toString();
}

function showIdentifyCard() {
  identifyCard.style.display = 'block';
  threadInner.innerHTML = '';
  composer.classList.remove('show');
  docBadge.textContent = '';
  currentDocument = null;
}

function enterChatMode(sourceDocument) {
  currentDocument = sourceDocument;
  identifyCard.style.display = 'none';
  composer.classList.add('show');
  docBadge.innerHTML = `Chatting about <b>${sourceDocument}</b>`;
  q.focus();
}

// --- Sidebar: conversation list ---

async function loadThreadList() {
  try {
    const res = await fetch(`${API_BASE}/conversations`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    renderThreadList(await res.json());
  } catch (err) {
    threadList.innerHTML = `<div class="thread-empty">Couldn't load history</div>`;
  }
}

function renderThreadList(items) {
  if (items.length === 0) {
    threadList.innerHTML = `<div class="thread-empty">No conversations yet</div>`;
    return;
  }
  threadList.innerHTML = '';
  items.forEach((item) => {
    const row = document.createElement('div');
    row.className = 'thread-item' + (item.session_id === sessionId ? ' active' : '');
    row.innerHTML = `
      <div class="thread-item-body">
        <div class="thread-item-title"></div>
        <div class="thread-item-doc"></div>
      </div>
      <button class="thread-item-delete" title="Delete">×</button>
    `;
    row.querySelector('.thread-item-title').textContent = item.title;
    row.querySelector('.thread-item-doc').textContent = item.source_document;
    row.querySelector('.thread-item-body').addEventListener('click', () => openThread(item.session_id));

    row.querySelector('.thread-item-delete').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${item.title}"?`)) return;
      await fetch(`${API_BASE}/conversations/${item.session_id}`, { method: 'DELETE' });
      if (item.session_id === sessionId) {
        startNewChat();
        return;
      }
      loadThreadList();
    });

    threadList.appendChild(row);
  });
}

async function openThread(id) {
  if (id === sessionId) return;
  sessionId = id;
  const url = new URL(window.location.href);
  url.searchParams.set('session_id', sessionId);
  history.replaceState(null, '', url);
  await loadHistoryIntoView(id);
  loadThreadList();
}

async function loadHistoryIntoView(id) {
  try {
    const res = await fetch(`${API_BASE}/conversations/${id}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    enterChatMode(data.source_document);
    threadInner.innerHTML = '';
    data.messages.forEach((m) => {
      if (m.role === 'user') renderUserMessage(m.content);
      else renderAiMessage(m.content);
    });
  } catch (err) {
    showIdentifyCard();
    renderError(`Couldn't load that conversation: ${err.message}`);
  }
}

// --- Rendering ---

function renderMarkdown(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for (let raw of lines) {
    const line = raw.trim();
    if (line.startsWith('- ') || line.startsWith('• ')) {
      if (!inList) { html += '<ul class="answer-list">'; inList = true; }
      html += `<li>${inlineFormat(line.slice(2))}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (line.length === 0) html += '<div class="answer-spacer"></div>';
    else html += `<p>${inlineFormat(line)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

function inlineFormat(str) {
  const escaped = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function scrollToBottom() { thread.scrollTop = thread.scrollHeight; }

function renderUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  threadInner.appendChild(div);
  scrollToBottom();
}

function renderAiMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `
    <div class="label-row"><span class="source-tag">${currentDocument || 'document'}</span></div>
    <div class="answer-block"></div>
  `;
  div.querySelector('.answer-block').innerHTML = renderMarkdown(text);
  threadInner.appendChild(div);
  scrollToBottom();
}

function renderError(message) {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `<div class="answer-block error-block"></div>`;
  div.querySelector('.error-block').textContent = message;
  threadInner.appendChild(div);
  scrollToBottom();
}

let thinkingInterval = null;
const THINKING_PHRASES = ["Reading the document…", "Checking the source…", "Putting together an answer…"];

function renderThinking() {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.id = 'thinkingMsg';
  div.innerHTML = `<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span id="thinkingText"></span></div>`;
  div.querySelector('#thinkingText').textContent = THINKING_PHRASES[0];
  threadInner.appendChild(div);
  scrollToBottom();
  let i = 0;
  thinkingInterval = setInterval(() => {
    i = (i + 1) % THINKING_PHRASES.length;
    const el = document.getElementById('thinkingText');
    if (el) el.textContent = THINKING_PHRASES[i];
  }, 1400);
}

function removeThinking() {
  if (thinkingInterval) { clearInterval(thinkingInterval); thinkingInterval = null; }
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

// --- Identify step ---

identifyBtn.addEventListener('click', async () => {
  const snippet = snippetInput.value.trim();
  if (!snippet) return;
  identifyBtn.disabled = true;
  identifyBtn.textContent = 'Identifying...';
  resultBox.classList.remove('show', 'matched', 'unmatched');
  try {
    const res = await fetch(`${API_BASE}/identify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ snippet }),
    });
    const data = await res.json();
    resultBox.classList.add('show');
    if (data.matched) {
      resultBox.classList.add('matched');
      resultBox.innerHTML =
        `Matched to <span class="doc-name">${data.source_document}</span>` +
        `<div class="meta">method: ${data.method} · confidence: ${data.confidence}</div>` +
        `<button class="enter-chat" id="enterChatBtn">Chat about this document →</button>`;
      document.getElementById('enterChatBtn').addEventListener('click', () => enterChatMode(data.source_document));
    } else {
      resultBox.classList.add('unmatched');
      if (data.closest_document) {
        resultBox.innerHTML =
          `No confident match — this doesn't appear to be excerpted from any document in the corpus.` +
          `<div class="meta">closest topic match: ${data.closest_document} (similarity ${data.closest_similarity}) — not treated as a match</div>`;
      } else {
        resultBox.innerHTML = `No match found in the corpus.`;
      }
    }
  } catch (err) {
    resultBox.classList.add('show', 'unmatched');
    resultBox.textContent = 'Request failed — is the API running on localhost:8000?';
  } finally {
    identifyBtn.disabled = false;
    identifyBtn.textContent = 'Identify Source';
  }
});

// --- Chat step ---

async function ask(question) {
  if (!question.trim() || !currentDocument) return;
  sendBtn.disabled = true;
  renderUserMessage(question);
  renderThinking();
  try {
    const res = await fetch(`${API_BASE}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, source_document: currentDocument, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    removeThinking();
    renderAiMessage(data.answer);
    if (data.session_id && data.session_id !== sessionId) {
      sessionId = data.session_id;
      const url = new URL(window.location.href);
      url.searchParams.set('session_id', sessionId);
      history.replaceState(null, '', url);
    }
    loadThreadList();
  } catch (err) {
    removeThinking();
    renderError(`Something went wrong: ${err.message}`);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => {
  const text = q.value;
  q.value = '';
  q.style.height = 'auto';
  ask(text);
});

q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 140) + 'px';
});

// --- Initial load ---

if (sessionId) {
  loadHistoryIntoView(sessionId);
} else {
  showIdentifyCard();
}
loadThreadList();
</script>
</body>
</html>
